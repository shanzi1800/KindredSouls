name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: false  # 2026-08-02 临时禁用：railway up 走中毒缓存，改由 Railway 原生 GitHub webhook 构建
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write git SHA to file (for deployment fingerprint)
        run: |
          git rev-parse HEAD > .git-sha
          echo "Git SHA written: $(cat .git-sha)"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --detach --service KindredSouls
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: 738a638d-f90d-45b0-94cb-f501ae31c5d2
        timeout-minutes: 10

      - name: Verify deployment
        run: |
          sleep 30
          HEALTH=$(curl -s -o /dev/null -w "%{http_code}" "https://kindredsouls-production.up.railway.app/api/health" --max-time 15)
          if [ "$HEALTH" = "200" ]; then
            echo "✅ Railway health check passed"
            curl -s "https://kindredsouls-production.up.railway.app/api/health"
          else
            echo "❌ Railway health check failed: HTTP $HEALTH"
            exit 1
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment failed for commit ${{ github.sha }}"
          echo "Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
