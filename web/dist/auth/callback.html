<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signing in…</title>
  <style>
    body {
      background: #0D0D1A;
      color: #D4AF37;
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      flex-direction: column;
      gap: 16px;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(212,175,55,0.2);
      border-top-color: #D4AF37;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #8B8778; margin: 0; font-size: 14px; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p id="msg">Authenticating…</p>
  <script type="module">
    const SB_URL = 'https://wfkxqhlcgrikxoofjvas.supabase.co';
    const SB_ANON = 'sb_publishable_v4T_OvG7eZp48NJH4ALQzA_GVd0SsJv';

    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    (async () => {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const err = params.get('error');

      if (err) {
        document.getElementById('msg').textContent = 'Auth error: ' + err;
        setTimeout(() => window.close(), 3000);
        return;
      }

      if (!code) {
        document.getElementById('msg').textContent = 'No auth code found';
        setTimeout(() => window.close(), 2000);
        return;
      }

      try {
        const sb = createClient(SB_URL, SB_ANON, {
          auth: { flowType: 'pkce', autoRefreshToken: true, persistSession: true }
        });
        const { error: exErr } = await sb.auth.exchangeCodeForSession(code);
        if (exErr) throw exErr;

        // ══════════════════════════════════════════════════════
        // 🛡️ 单一信号源：只写这个标志，其他什么都不做
        // ══════════════════════════════════════════════════════
        const pendingPlan = localStorage.getItem('ks_pending_checkout_plan');
        const trigger = JSON.stringify({ timestamp: Date.now(), plan: pendingPlan || null });
        localStorage.setItem('ks_auth_success_trigger', trigger);
        localStorage.removeItem('ks_oauth_in_progress');

        // ══════════════════════════════════════════════════════
        // 🔄 E72（主公军令 2026-10-19）双模收口：
        //   弹窗模式（脚本开窗）：close() 生效 ⇒ 父窗 polling 接管；
        //   重定向模式（E72 移动端/统一链路）：顶层页签 close() 静默无效
        //   ⇒ 350ms 后仍在 ⇒ 整页跳回全参现场＋intent=checkout 自动续跑收银台
        //   （旧行为直接停在回调页，用户被晾死在转圈页）
        // ══════════════════════════════════════════════════════
        window.close();
        setTimeout(() => {
          if (window.closed) return; // 弹窗模式已关 ⇒ 父窗接管
          // 🔴 E87-④/⑤（主公军令 2026-10-25）：ks_oauth_back_url 只服务「财富购买意图」
          //    的回场续跑（E72 intent=checkout 全参现场）；纯登录（无 pendingPlan）与
          //    姻缘购买意图一律回 '/'——陈年 backUrl（财富页所写、只写不清）曾把
          //    重新登录劫持进 /wealth/report?… 死循环，首页永不可达。用后即清，绝不滞留。
          const WEALTH_PLANS = ['wealth_once','wealth_monthly_report','wealth_yearly_report','star_monthly_vip','all_pass_yearly'];
          let target = '/';
          if (pendingPlan && WEALTH_PLANS.indexOf(pendingPlan) !== -1) {
            const back = localStorage.getItem('ks_oauth_back_url');
            if (back) target = back;
          }
          try { localStorage.removeItem('ks_oauth_back_url'); } catch (e) { /* noop */ }
          if (pendingPlan) {
            target += (target.includes('?') ? '&' : '?') + 'intent=checkout&plan=' + encodeURIComponent(pendingPlan);
          }
          console.log('[KS Auth Callback] 🔄 E72/E87 重定向模式收口 →', target);
          window.location.replace(target);
        }, 350);
      } catch (e) {
        console.error('[KS Auth Callback] ❌ Exchange failed:', e);
        document.getElementById('msg').textContent = 'Session error: ' + (e.message || 'unknown');
        setTimeout(() => window.close(), 3000);
      }
    })();
  </script>
</body>
</html>
