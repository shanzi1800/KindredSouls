# V332: 破 Railway 构建缓存
# Railway 在检测到 Dockerfile 时用 Docker builder，
# 但 Nixpacks.toml 可以作为 Nixpacks build plan 的补充配置

# 强制每次构建都是 fresh build
[nixpacks]
# 禁用 node_modules 跨构建缓存
NO_CACHE = "true"

[phases.setup]
# 确保用最新的 Node.js
nixPkgs = ["nodejs_20"]

[phases.build]
# 在 build 命令前加一个 timestamp 行，强制 Nixpacks 判定 build phase 已变
cmds = [
    "echo 'NIXPACKS_BUILD_TIME=2026-09-04T18:21:00+08:00'",
    "npm run build || echo 'no build script'",
]
