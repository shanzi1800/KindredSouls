# nixpacks.toml - Railway+Nixpacks 完整构建配置
# V338: Railway 不走 Dockerfile 的 COPY（V337 方案失败），
#       改用 Nixpacks build phase 直接 cp 预编译 dist。
#       Railway 容器: Nixpacks 检测 Node.js → npm install → npm run build（用本地 dist）
#       本地 git 的 web/dist 已含最新前端代码，npm run build 不重写它（Vite 增量+无改变检测）

[nixpacks]
NO_CACHE = "true"

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.build]
# V339: 强制 COPY 新代码——每次构建先 rm 旧文件，防止 Railway BuildKit 缓存劫持
cmds = [
    "rm -rf /app /kindredsouls 2>/dev/null || true",
    "npm install --prefer-offline 2>/dev/null || npm install",
    "npm run build 2>/dev/null || echo '[nixpacks] npm run build skipped (no package.json scripts or no changes)'",
    "echo '[V339] Build complete. server.js size: '$(wc -c < server.js)' bytes'",
    "if [ \"$(wc -c < server.js 2>/dev/null || echo 0)\" -lt 400000 ]; then echo '[V339-ERROR] server.js too small, COPY may have failed!'; exit 1; fi",
]

[start]
# Railway 从这里取 CMD，覆盖 Dockerfile CMD
# Nixpacks 检测 Node.js 后自动设置 NODE_ENV=production
exec = ["node", "server.js"]
